name: pluto_ar_sim
description: AR flight simulator for learning to fly the Pluto drone (CPAD mini project).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  arkit_plugin: ^1.0.7
  vector_math: ^2.1.4
  http: ^1.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
